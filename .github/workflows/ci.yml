name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # Standard Linux runner only. Per repo billing policy, no macOS, Windows,
    # large, or self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Both actions are pinned to a major that natively targets the
      # Node.js 24 runtime. The runners deprecated the Node.js 20
      # runtime on 2025-09-19 and now FORCE node20 actions to run on
      # node24, printing a warning on every job. The v4 majors of these
      # two actions still declare `using: node20`, so the workflow was
      # running on a runtime the platform had retired, by way of an
      # override that is explicitly documented as temporary.
      #
      # `actions/checkout@v7` and `actions/setup-node@v7` declare
      # `using: node24` themselves. The inputs this workflow relies on
      # (`node-version`, `cache`, `cache-dependency-path`) are unchanged
      # from v4. `setup-node` v5 added an automatic-cache path that
      # activates only when package.json carries a `packageManager`
      # field; this repository's package.json does not, so the explicit
      # `cache: npm` below remains the only cache configuration.
      #
      # `tests/ci-workflow-gate.test.js` asserts that neither action is
      # pinned below v5, so the deprecation cannot silently return.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # The coverage gate was verified on Node 26.8.1. Pinned to the major
          # series that was actually exercised rather than an untested guess.
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The anti-pattern detector shells out to ripgrep. The GitHub
      # ubuntu-latest image does NOT ship ripgrep, so without this step
      # every `rg` invocation fails, every `rg -q` check reports the
      # thing it was looking for as missing, and the detector reports a
      # long list of violations on files that are perfectly correct.
      # That is what made CI red on main for six consecutive commits
      # before 2026-10-21: the failure was the missing tool, not the
      # code.
      #
      # The install is pinned to the package the runner provides. It is
      # a dependency of the detector, so it is declared here rather
      # than assumed.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Anti-pattern detector
        run: bash scripts/anti-pattern-detector.sh

      - name: Syntax check
        run: npm run check

      # The publication staging step. It runs esbuild over the CSS and the
      # JavaScript and writes the content-hashed bundle plus its manifest
      # into `bundled/`, which is gitignored and therefore absent from a
      # fresh checkout.
      #
      # `tests/workbench-dynamic.test.js` reads that bundle to prove the
      # two project workbenches were NOT inlined into the main bundle. It
      # has no way to pass without the artifact, and before this step
      # existed the CI runner never produced one. The failure read as
      # "manifest.json must exist after a bundle run", which is true and
      # not the point: the point is that CI never ran a bundle.
      #
      # This is the second defect that the ripgrep fix uncovered. The
      # detector had been failing on the missing tool since the workflow
      # was added, so the step after it was never reached, so the missing
      # build step was never seen.
      #
      # The staging step is local: it needs no network and no Vercel
      # account. It writes to `dist/` and `bundled/`, both gitignored.
      - name: Stage publication
        run: npm run stage:publication

      - name: Test suite
        run: npm test

      # The stale-claim scanner. It checks whether a document's stated
      # test count agrees with the suite's actual count, and whether a
      # "complete" round list matches the rounds that have entries.
      #
      # It measures the suite itself, in a child run that excludes the
      # stale-claim test files, so the count it compares against is the
      # count the suite reports. This is the CI half of the check; the
      # pre-commit hook runs it locally.
      - name: Stale-claim scanner
        run: node scripts/scan-stale-claims.js

      - name: Coverage gate (85% floor)
        run: npm run test:coverage
