            - generic [ref=f9e110]:
              - heading "Problem" [level=2] [ref=f9e111]
              - paragraph [ref=f9e112]: Coding-agent workloads create many concurrent processes and resource events; the runtime needs to observe and coordinate them without hiding contention.
            - generic [ref=f9e113]:
              - heading "Context" [level=2] [ref=f9e114]
              - paragraph [ref=f9e115]: ShareCLI sits close to the OS/runtime boundary, where process state, filesystem behavior, and thermal pressure affect user-visible performance.
            - generic [ref=f9e116]:
              - heading "Architecture" [level=2] [ref=f9e117]
              - paragraph [ref=f9e118]: Rust coordinates process/resource observation, queueing, coalescing, and optional FUSE-backed views for shared execution state.
            - generic [ref=f9e119]:
              - heading "Constraints" [level=2] [ref=f9e120]
              - paragraph [ref=f9e121]: The design must remain installable, buildable, and demonstrable on real developer machines while handling bursts instead of assuming a quiet workload.
            - generic [ref=f9e122]:
              - heading "Key decisions" [level=2] [ref=f9e123]
              - paragraph [ref=f9e124]: Coalescing, debounce, and queue policies reduce duplicate work; observability makes contention and thermal behavior inspectable.
            - generic [ref=f9e125]:
              - heading "Verification" [level=2] [ref=f9e126]
              - paragraph [ref=f9e127]: The current repository evidence includes install/build/demo paths and documents the runtime boundary.
            - generic [ref=f9e128]:
              - heading "Current limitations" [level=2] [ref=f9e129]
              - paragraph [ref=f9e130]: No adoption or scale claim is made; hardware-specific contention and FUSE behavior remain important operational variables.
            - generic [ref=f9e131]:
              - heading "Retrospective" [level=2] [ref=f9e132]
              - paragraph [ref=f9e133]: The project treats coding-agent concurrency as a systems problem, not merely a CLI feature.
