            - generic [ref=f21e82]:
              - heading "Why this simulation architecture" [level=2] [ref=f21e83]
              - paragraph [ref=f21e84]: The model separated strategic movement through a directed road graph from local traffic physics. Intersections became graph nodes and road segments became edges, while each road carried a disjoint 2D cellular automaton for vehicles, lanes, and gaps.
            - generic [ref=f21e85]:
              - heading "Directed graph + cellular automata split" [level=2] [ref=f21e86]
              - paragraph [ref=f21e87]: A* routed vehicles between points of interest using road type, speed limit, and turn penalties. The Nagel–Schreckenberg-inspired automata handled acceleration, gap-based slowing, randomized driver variability, lane/merge/intersection behavior, and progression into the next segment.
            - generic [ref=f21e88]:
              - heading "Routing model" [level=2] [ref=f21e89]
              - paragraph [ref=f21e90]: Vehicles spawned at residential POIs, travelled to commercial POIs, then received a new assignment of the opposite type. Congestion-aware weighting and in-route recalculation were documented as future work, not completed functionality.
            - generic [ref=f21e91]:
              - heading "Emergent traffic behavior" [level=2] [ref=f21e92]
              - paragraph [ref=f21e93]: The simulation produced congestion, stop-and-go waves, and gridlock from local rules running on ordinary consumer hardware. Those behaviors made the network-level consequences of routing policy visible rather than theoretical.
            - generic [ref=f21e94]:
              - heading "The system-level routing problem" [level=2] [ref=f21e95]
              - paragraph [ref=f21e96]: "Within roughly a week, the prototype exposed a mismatch between individually optimal routes and network-wide flow: independently minimizing route cost can concentrate agents on the same attractive segments. The next correction was identified as congestion-aware weighting, dynamic rerouting, and—at the broader system level—occasionally accepting a slower route to reduce aggregate bottleneck pressure."
            - generic [ref=f21e97]:
              - heading "Experimental authoring workflow" [level=2] [ref=f21e98]
              - paragraph [ref=f21e99]: An unsubmitted Stable Diffusion + ControlNet workflow translated hand-drawn road sketches into an OSM-like visual normalization and then into backend network geometry. The proof of concept worked at baseline, but limited data, compute, and iteration time kept accuracy below reliable-ingestion quality.
            - generic [ref=f21e100]:
              - heading "What was not finished" [level=2] [ref=f21e101]
              - paragraph [ref=f21e102]: Congestion-aware A*, dynamic in-route recalculation, and production-grade sketch ingestion were future or experimental directions. This entry does not claim they shipped.
            - generic [ref=f21e103]:
              - heading "Retrospective / later external comparison" [level=2] [ref=f21e104]
              - paragraph [ref=f21e105]: Any comparison to later mapping or routing experiments belongs in a separately sourced retrospective. No claim of prediction, copying, or causal influence is made here.
            - generic [ref=f21e106]:
              - heading "AI-assistance disclosure" [level=2] [ref=f21e107]
              - paragraph [ref=f21e108]: AI-assisted implementation reduced the cost and time required to turn the simulation design into an executable environment. The requirements, architecture, simulation model, algorithm selection, routing design, system interpretation, future direction, and identification of the routing failure mode remained user-owned.
